server {
    listen 80;
    server_name _;

    # Thư mục gốc chứa các file build từ React (được COPY vào đây)
    root /usr/share/nginx/html;
    index index.html;

    # 1. React SPA: Xử lý client-side routing
    location / {
        # Nếu file không tồn tại, trả về index.html để React Router xử lý
        try_files $uri /index.html;
        # Tắt caching cho file index.html để đảm bảo người dùng luôn nhận được phiên bản mới
        add_header Cache-Control "no-cache";
    }

    # 2. API Django: Proxy các request /api/ tới dịch vụ backend
    location /api/ {
        # 'backend' là tên dịch vụ (hostname) trong Docker Compose
        proxy_pass http://backend:8000/api/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static files của Django: Proxy request tới backend
    # CHÚ Ý: Đã thay alias thành proxy_pass vì files nằm trong container backend
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Media files của Django: Proxy request tới backend
    # CHÚ Ý: Đã thay alias thành proxy_pass vì files nằm trong container backend
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. WebSocket: Proxy và cấu hình headers đặc biệt
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # Headers cần thiết cho việc nâng cấp kết nối HTTP lên WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. Cache tĩnh React: Áp dụng Cache-Control cho các loại file tĩnh phổ biến
    location ~* \.(?:ico|css|js|json|jpg|jpeg|png|svg|gif|woff2|woff|ttf|otf)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 7. Tối ưu hóa hiệu suất
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}